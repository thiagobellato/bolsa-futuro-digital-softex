<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>
      {% block title %}
        Cine Django
      {% endblock %}
    </title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(to top, #021a0b 60%, #1db954);
        font-family: Arial, sans-serif;
        color: #ffffff;
        min-height: 100vh;
      }
      main {
        max-width: 1080px;
        margin: 32px auto;
        padding: 24px;
      }
      footer {
        text-align: center;
        margin-top: 40px;
        color: #88a892;
        font-size: 0.9rem;
        padding-bottom: 30px;
      }
    </style>
    {% block extra_css %}

    {% endblock %}
  </head>
  <body>
    {% include 'navbar.html' %}
    <main>
      {% block content %}

      {% endblock %}
    </main>
    <footer>Cine Django © 2025 • Qualquer semelhança com serviços reais é pura coincidência (ou não).</footer>
    {% block extra_js %}

    {% endblock %}
  </body>
</html>
